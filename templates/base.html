<!doctype html>
<html class="light" lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
    <style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: #f9f6f2;
        color: #1b1c1c;
      }
    </style>
    <title>{% block title %}Lumina{% endblock %}</title>
  </head>
  <body class="antialiased min-h-screen">
    <header class="fixed top-0 left-0 w-full z-50 bg-[#F9F6F2] border-b border-stone-200">
      <div class="flex justify-between items-center w-full px-6 h-16">
        <button class="p-2 rounded-full hover:bg-stone-200/50">
          <span class="material-symbols-outlined text-stone-900">menu</span>
        </button>
        <h1 class="text-xl font-bold tracking-tighter text-stone-900">Lumina</h1>
        <button class="p-2 rounded-full hover:bg-stone-200/50">
          <span class="material-symbols-outlined text-stone-900">search</span>
        </button>
      </div>
    </header>

    <div class="fixed top-16 left-0 w-full h-[2px] bg-stone-200 z-40">
      <div class="h-full bg-[#695d46] w-1/3"></div>
    </div>

    <main class="pt-24 pb-28 px-6 max-w-2xl mx-auto">
      {% block content %}{% endblock %}
    </main>

    <nav class="fixed bottom-0 left-0 w-full flex justify-around items-center px-4 py-3 bg-[#F9F6F2] border-t border-stone-200 z-50">
      <a
        class="flex flex-col items-center justify-center px-4 py-1 rounded-lg {% if current_page == 'feed' %}text-stone-900 bg-[#E6D5B8]{% else %}text-stone-400 hover:text-stone-600{% endif %}"
        href="{{ url_for('posts_list') }}"
      >
        <span class="material-symbols-outlined">article</span>
        <span class="text-[11px] font-medium uppercase tracking-widest mt-1">Feed</span>
      </a>
      <a
        class="flex flex-col items-center justify-center px-4 py-1 rounded-lg {% if current_page == 'write' %}text-stone-900 bg-[#E6D5B8]{% else %}text-stone-400 hover:text-stone-600{% endif %}"
        href="{{ url_for('posts_new') }}"
      >
        <span class="material-symbols-outlined">edit_square</span>
        <span class="text-[11px] font-medium uppercase tracking-widest mt-1">Write</span>
      </a>
      <a class="flex flex-col items-center justify-center text-stone-400 px-4 py-1">
        <span class="material-symbols-outlined">person</span>
        <span class="text-[11px] font-medium uppercase tracking-widest mt-1">Profile</span>
      </a>
    </nav>
  </body>
</html>
